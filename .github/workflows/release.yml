name: Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: "actions/checkout@v4"
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore FaceOFFx.sln

      - name: Build
        run: dotnet build FaceOFFx.sln --configuration Release --no-restore -warnaserror

      - name: Pack the FaceOFFx library
        run: |
          version="$(dotnet msbuild src/FaceOFFx/FaceOFFx.csproj -getProperty:Version)"
          test "$GITHUB_REF_NAME" = "v$version"
          dotnet pack src/FaceOFFx/FaceOFFx.csproj --configuration Release --no-build --output artifacts/release-packages
          python scripts/verify_package.py artifacts/release-packages --version "$version"

      - name: Verify release tests
        run: |
          for project in Core Infrastructure Cli Diagnostics.Cli; do
            dotnet test "tests/FaceOFFx.$project.Tests/FaceOFFx.$project.Tests.csproj" --configuration Release --no-build -f net10.0
          done
          dotnet test tests/CoreJ2K.FaceOFFx.Tests/CoreJ2K.FaceOFFx.Tests.csproj --configuration Release --no-build -f net10.0

      - name: Generate library SBOM with vendored codec and models
        run: |
          dotnet tool install --global CycloneDX --version 5.4.0
          version="$(dotnet msbuild src/FaceOFFx/FaceOFFx.csproj -getProperty:Version)"
          dotnet CycloneDX src/FaceOFFx/FaceOFFx.csproj \
            --framework net8.0 \
            --recursive \
            --include-project-references \
            --disable-package-restore \
            --base-intermediate-output-path artifacts/obj \
            --disable-github-licenses \
            --set-name FaceOFFx \
            --set-version "$version" \
            --set-type Library \
            --output artifacts \
            --filename sbom-raw.json \
            --output-format Json
          python3 scripts/merge_release_sbom.py artifacts/sbom-raw.json artifacts/sbom.json

          # Preserve the SPDX compatibility artifact.
          dotnet tool install --global Microsoft.Sbom.DotNetTool
          ~/.dotnet/tools/sbom-tool generate -b ./artifacts -bc . -pn FaceOFFx -pv "$version" -ps mistial-dev -nsb https://github.com/mistial-dev/FaceOFFx

      - name: Create Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
        with:
          files: |
            ./artifacts/release-packages/FaceOFFx.*.nupkg
            ./artifacts/sbom.json
            ./artifacts/_manifest/spdx_2.2/*.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
