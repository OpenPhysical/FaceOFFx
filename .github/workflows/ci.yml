name: CI Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        tfm: [net8.0, net9.0, net10.0]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore FaceOFFx.sln

      - name: Build
        run: dotnet build FaceOFFx.sln --configuration Release --no-restore -f ${{ matrix.tfm }} -warnaserror

      - name: Test
        run: |
          dotnet test tests/FaceOFFx.Core.Tests/FaceOFFx.Core.Tests.csproj --configuration Release --no-build -f ${{ matrix.tfm }} --settings tests/FaceOFFx.Core.Tests.runsettings --logger "trx;LogFileName=core-${{ matrix.tfm }}.trx"
          dotnet test tests/FaceOFFx.Infrastructure.Tests/FaceOFFx.Infrastructure.Tests.csproj --configuration Release --no-build -f ${{ matrix.tfm }} --settings tests/FaceOFFx.Infrastructure.Tests.runsettings --logger "trx;LogFileName=infra-${{ matrix.tfm }}.trx"
          dotnet test tests/FaceOFFx.Cli.Tests/FaceOFFx.Cli.Tests.csproj --configuration Release --no-build -f ${{ matrix.tfm }} --settings tests/FaceOFFx.Cli.Tests.runsettings --logger "trx;LogFileName=cli-${{ matrix.tfm }}.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.tfm }}
          path: "**/*.trx"

  pack-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore FaceOFFx.sln

      - name: Build
        run: dotnet build FaceOFFx.sln --configuration Release --no-restore -warnaserror

      - name: Pack packages
        run: |
          dotnet pack src/FaceOFFx/FaceOFFx.csproj --configuration Release --no-restore
          dotnet pack src/FaceOFFx.Cli/FaceOFFx.Cli.csproj --configuration Release --no-build

      - name: Install and smoke test tool
        run: |
          dotnet tool install --global --add-source ./src/FaceOFFx.Cli/nupkg FaceOFFx.Cli
          ~/.dotnet/tools/faceoffx quality --input tests/sample_images/generic_guy.png --format json || test $? -eq 1
