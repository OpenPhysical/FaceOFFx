name: CI Build

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        tfm: [net8.0, net9.0, net10.0]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore FaceOFFx.sln

      - name: Build
        run: dotnet build FaceOFFx.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: |
          dotnet test tests/FaceOFFx.Core.Tests/FaceOFFx.Core.Tests.csproj --configuration Release --no-build -f ${{ matrix.tfm }} --settings tests/FaceOFFx.Core.Tests.runsettings --logger "trx;LogFileName=core-${{ matrix.tfm }}.trx"
          dotnet test tests/FaceOFFx.Infrastructure.Tests/FaceOFFx.Infrastructure.Tests.csproj --configuration Release --no-build -f ${{ matrix.tfm }} --settings tests/FaceOFFx.Infrastructure.Tests.runsettings --logger "trx;LogFileName=infra-${{ matrix.tfm }}.trx"
          dotnet test tests/FaceOFFx.Cli.Tests/FaceOFFx.Cli.Tests.csproj --configuration Release --no-build -f ${{ matrix.tfm }} --settings tests/FaceOFFx.Cli.Tests.runsettings --logger "trx;LogFileName=cli-${{ matrix.tfm }}.trx"
          dotnet test tests/FaceOFFx.Diagnostics.Cli.Tests/FaceOFFx.Diagnostics.Cli.Tests.csproj --configuration Release --no-build -f ${{ matrix.tfm }} --logger "trx;LogFileName=diagnostics-${{ matrix.tfm }}.trx"
          dotnet test tests/CoreJ2K.FaceOFFx.Tests/CoreJ2K.FaceOFFx.Tests.csproj --configuration Release --no-build -f ${{ matrix.tfm }} --logger "trx;LogFileName=codec-${{ matrix.tfm }}.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.tfm }}
          path: "**/*.trx"

  pack-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore FaceOFFx.sln

      - name: Build
        run: dotnet build FaceOFFx.sln --configuration Release --no-restore -warnaserror

      - name: Pack the library
        run: |
          dotnet pack src/FaceOFFx/FaceOFFx.csproj --configuration Release --no-build --output artifacts/release-packages
          python scripts/verify_package.py artifacts/release-packages --version "$(dotnet msbuild src/FaceOFFx/FaceOFFx.csproj -getProperty:Version)"
          python -m unittest discover -s scripts -p test_verify_package.py

      - name: Smoke test package consumers
        run: |
          for tfm in net8.0 net9.0 net10.0; do
            dotnet run --project scripts/PackageSmoke --configuration Release --framework "$tfm" -p:FaceOffxPackageSource="$GITHUB_WORKSPACE/artifacts/release-packages" -p:RestorePackagesPath="$RUNNER_TEMP/faceoffx-consumer-packages" -- tests/test-images/people/johnson/source.jpg
          done

      - name: Smoke test the CLI shim
        run: |
          mkdir -p "$RUNNER_TEMP/faceoffx-smoke"
          dotnet run --project src/FaceOFFx.Cli --configuration Release --no-build -f net10.0 -- tests/test-images/people/johnson/source.jpg -o "$RUNNER_TEMP/faceoffx-smoke/portrait.jp2" --json > "$RUNNER_TEMP/faceoffx-smoke/result.json"
          python -m json.tool "$RUNNER_TEMP/faceoffx-smoke/result.json" > /dev/null
