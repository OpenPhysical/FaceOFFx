name: Publish NuGet Package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Approve publication of the validated FaceOFFx package"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore FaceOFFx.sln

      - name: Build
        run: dotnet build FaceOFFx.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: |
          for tfm in net8.0 net9.0 net10.0; do
            for project in Core Infrastructure Cli Diagnostics.Cli; do
              dotnet test "tests/FaceOFFx.$project.Tests/FaceOFFx.$project.Tests.csproj" --configuration Release --no-build -f "$tfm"
            done
            dotnet test tests/CoreJ2K.FaceOFFx.Tests/CoreJ2K.FaceOFFx.Tests.csproj --configuration Release --no-build -f "$tfm"
          done

      - name: Pack library
        run: |
          dotnet pack src/FaceOFFx/FaceOFFx.csproj --configuration Release --no-build --output artifacts/release-packages
          python scripts/verify_package.py artifacts/release-packages --version "$(dotnet msbuild src/FaceOFFx/FaceOFFx.csproj -getProperty:Version)"

      - name: Verify package consumers
        run: |
          for tfm in net8.0 net9.0 net10.0; do
            dotnet run --project scripts/PackageSmoke --configuration Release --framework "$tfm" -p:FaceOffxPackageSource="$GITHUB_WORKSPACE/artifacts/release-packages" -p:RestorePackagesPath="$RUNNER_TEMP/faceoffx-consumer-packages" -- tests/test-images/people/johnson/source.jpg
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/release-packages/FaceOFFx.*.nupkg

      - name: Validate release tag
        if: inputs.publish
        run: |
          version="$(dotnet msbuild src/FaceOFFx/FaceOFFx.csproj -getProperty:Version)"
          test "$GITHUB_REF" = "refs/tags/v$version"

      - name: NuGet login
        if: inputs.publish && startsWith(github.ref, 'refs/tags/v')
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: mistial-dev

      - name: Publish to NuGet
        if: inputs.publish && startsWith(github.ref, 'refs/tags/v')
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          version="$(dotnet msbuild src/FaceOFFx/FaceOFFx.csproj -getProperty:Version)"
          test "$GITHUB_REF_NAME" = "v$version"
          dotnet nuget push "./artifacts/release-packages/FaceOFFx.$version.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
