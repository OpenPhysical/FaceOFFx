name: Publish NuGet Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore FaceOFFx.sln

      - name: Build
        run: dotnet build FaceOFFx.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: |
          dotnet test tests/FaceOFFx.Core.Tests/FaceOFFx.Core.Tests.csproj --configuration Release --no-build -f net10.0 --settings tests/FaceOFFx.Core.Tests.runsettings
          dotnet test tests/FaceOFFx.Infrastructure.Tests/FaceOFFx.Infrastructure.Tests.csproj --configuration Release --no-build -f net10.0 --settings tests/FaceOFFx.Infrastructure.Tests.runsettings
          dotnet test tests/FaceOFFx.Cli.Tests/FaceOFFx.Cli.Tests.csproj --configuration Release --no-build -f net10.0 --settings tests/FaceOFFx.Cli.Tests.runsettings

      - name: Pack CLI tool
        run: dotnet pack src/FaceOFFx.Cli/FaceOFFx.Cli.csproj --configuration Release --no-build

      - name: Pack library
        run: dotnet pack src/FaceOFFx/FaceOFFx.csproj --configuration Release --no-restore

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ./artifacts/packages/*.nupkg
            ./src/FaceOFFx.Cli/nupkg/*.nupkg

      - name: Publish to NuGet
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          dotnet nuget push ./artifacts/packages/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate
          dotnet nuget push ./src/FaceOFFx.Cli/nupkg/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate
